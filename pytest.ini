[pytest]
# Configuración de pytest para Scout AI - FASE 2

# Directorio de tests
testpaths = tests

# Patrones de descubrimiento de tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Marcadores personalizados
markers =
    edge_case: marca tests de casos límite y valores extremos
    integration: marca tests de integración end-to-end
    slow: marca tests que tardan más de 1 segundo
    requires_opencv: marca tests que requieren OpenCV real (no mockeado)

# Opciones de línea de comando
addopts =
    --verbose
    --strict-markers
    --tb=short
    --disable-warnings

# Cobertura
[coverage:run]
source = .
omit =
    */tests/*
    */venv/*
    */.venv/*
    */site-packages/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abstractproperty

precision = 2
