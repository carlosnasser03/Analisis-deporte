[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scout-ai"
version = "2.0.0"
description = "Scout AI - Advanced Sports Analytics Pipeline for Football/Soccer"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Scout AI Team", email = "info@scout-ai.com"}
]

keywords = ["sports", "football", "soccer", "analytics", "tracking", "detection"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.19.0",
    "opencv-python>=4.5.0",
    "ultralytics>=8.0.0",
    "supervision>=0.24.0",
    "scikit-learn>=0.24.0",
    "pandas>=1.1.0",
    "tqdm>=4.50.0",
    "Pillow>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.10",
    "black>=21.0",
    "flake8>=3.9",
    "mypy>=0.910",
    "isort>=5.9",
]

openvino = [
    "openvino>=2022.0.0",
    "onnx>=1.11.0",
]

statsbomb = [
    "statsbomb-py>=0.1.0",
]

deep-learning = [
    "torch>=1.9.0",
    "torchvision>=0.10.0",
]

[project.urls]
Homepage = "https://scout-ai.com"
Documentation = "https://docs.scout-ai.com"
Repository = "https://github.com/scout-ai/scout-ai"
"Bug Tracker" = "https://github.com/scout-ai/scout-ai/issues"

[tool.setuptools]
packages = [
    "core",
    "pipeline",
    "utils",
    "tests",
    "deep_sort_integration",
    "football_tracking_integration",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true
known_first_party = ["core", "pipeline", "utils", "deep_sort_integration", "football_tracking_integration"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "E266", "E501", "W503"]
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    ".eggs",
    "*.egg",
    "build",
    "dist",
]
